[project]
name = "lk-electricity-survey-eda"
version = "0.1.0"
description = "Exploratory analysis of a 70-household Sri Lankan household energy-conserving behaviour survey"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "prince>=0.13",
    "gower>=0.1.2",
    "kmodes>=0.12",
]

[tool.uv]
package = false
